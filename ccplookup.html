<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NC Course Catalog Explorer</title>
<style>
  :root { color-scheme: light; --ink:#182230; --muted:#667085; --line:#e4e7ec; --blue:#2457a7; --bg:#f6f8fb; }
  * { box-sizing:border-box; }
  body { margin:0; font:15px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif; color:var(--ink); background:var(--bg); }
  header { background:#fff; border-bottom:1px solid var(--line); padding:24px clamp(16px,4vw,42px) 18px; }
  h1 { margin:0 0 4px; font-size:clamp(22px,3vw,30px); letter-spacing:-.02em; }
  .subtitle { color:var(--muted); margin:0; }
  main { max-width:1550px; margin:0 auto; padding:22px clamp(12px,3vw,32px) 40px; }
  .controls { background:#fff; border:1px solid var(--line); border-radius:12px; padding:16px; display:grid; grid-template-columns:minmax(220px,2fr) repeat(3,minmax(150px,1fr)) auto; gap:12px; align-items:end; }
  label { display:block; color:#475467; font-size:12px; font-weight:650; margin:0 0 6px; }
  input,select,button { width:100%; min-height:40px; border:1px solid #cfd5df; border-radius:8px; padding:8px 10px; background:#fff; color:var(--ink); font:inherit; }
  input:focus,select:focus,button:focus { outline:3px solid #d8e6ff; border-color:var(--blue); }
  button { cursor:pointer; font-weight:600; }
  button:hover { background:#f2f6fc; }
  .reset { width:auto; white-space:nowrap; }
  .summary { display:flex; justify-content:space-between; gap:12px; align-items:center; margin:16px 2px 10px; color:var(--muted); font-size:13px; }
  .table-wrap { overflow:auto; background:#fff; border:1px solid var(--line); border-radius:12px; }
  table { border-collapse:collapse; width:100%; min-width:1150px; }
  th,td { text-align:left; padding:11px 12px; border-bottom:1px solid var(--line); vertical-align:middle; }
  th { position:sticky; top:0; z-index:1; background:#f8fafc; color:#475467; font-size:12px; letter-spacing:.02em; white-space:nowrap; }
  th button { border:0; background:transparent; padding:0; min-height:unset; width:auto; color:inherit; font:inherit; font-weight:700; text-align:left; }
  th button:hover { color:var(--blue); background:transparent; }
  tbody tr:hover { background:#f8fbff; }
  tbody tr:last-child td { border-bottom:0; }
  .code { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 13px; font-variant-numeric: tabular-nums; white-space: nowrap; color: #344054; background: #f1f5f9; padding: 2px 6px; border-radius: 4px; border: 1px solid #e2e8f0; }
  
  /* Badge Base Styling */
  .pill { display:inline-block; border-radius:999px; padding:3px 10px; font-size:12px; font-weight:600; white-space:nowrap; }

  /* CAA Eligibility Badges */
  .pill-caa[data-caa="Eligible"] { background:#eef4ff; color:#244b87; }
  .pill-caa[data-caa="Non-transfer"] { background:#f3f4f6; color:#4b5563; }

  /* Unique Color-Coded Course Weights */
  .pill-weight[data-weight="AP/Advanced"] { background:#f3e8ff; color:#6b21a8; border:1px solid #e9d5ff; }
  .pill-weight[data-weight="Honors"] { background:#fef3c7; color:#92400e; border:1px solid #fde68a; }
  .pill-weight[data-weight="Standard"] { background:#f1f5f9; color:#475467; border:1px solid #e2e8f0; }

  /* Unique Color-Coded Departments */
  .pill-dept[data-dept="Arts Ed"] { background:#ffe4e6; color:#9f1239; }
  .pill-dept[data-dept="Science"] { background:#d1fae5; color:#065f46; }
  .pill-dept[data-dept="CTE"] { background:#dbeafe; color:#1e40af; }
  .pill-dept[data-dept="Soc Stud"] { background:#ffedd5; color:#9a3412; }
  .pill-dept[data-dept="ELA"] { background:#ccfbf1; color:#115e59; }
  .pill-dept[data-dept="World Lang"] { background:#ede9fe; color:#5b21b6; }
  .pill-dept[data-dept="Math"] { background:#e0e7ff; color:#3730a3; }
  .pill-dept[data-dept="Hlth & PE"] { background:#e0f2fe; color:#0369a1; }
  .pill-dept[data-dept="Misc"] { background:#f3f4f6; color:#374151; }

  .empty { padding:36px; text-align:center; color:var(--muted); }
  .pagination { display:flex; align-items:center; justify-content:flex-end; gap:8px; margin-top:12px; }
  .pagination button { width:auto; min-width:82px; }
  .pagination button:disabled { opacity:.4; cursor:not-allowed; }
  .page-label { color:var(--muted); font-size:13px; min-width:100px; text-align:center; }
  @media (max-width:850px) { .controls { grid-template-columns:1fr 1fr; } .search-field { grid-column:1/-1; } .reset { width:100%; } }
  @media (max-width:520px) { .controls { grid-template-columns:1fr; } .search-field { grid-column:auto; } .summary { align-items:flex-start; flex-direction:column; } }
</style>
</head>

<header>

    <div><label for="weight">Course weight</label><select id="weight"><option value="">All weights</option></select></div>
    <button class="reset" id="reset" type="button">Clear filters</button>
  </section>

  <div class="summary">
    <div id="count" aria-live="polite"></div>
    <div>Tip: select any column heading to sort.</div>
  </div>

  <div class="table-wrap">
    <table>

        <th><button data-sort="state_code">State code ↕</button></th>

        <th><button data-sort="course_weight">Course weight ↕</button></th>
        <th><button data-sort="master_label">Master label ↕</button></th>
      </tr></thead>
      <tbody id="rows"></tbody>
    </table>
    <div class="empty" id="empty" hidden>No courses match your search and filters.</div>
  </div>
  <div class="pagination">
    <button id="previous" type="button">Previous</button>
    <span class="page-label" id="page"></span>
    <button id="next" type="button">Next</button>
  </div>
</main>

  [521,"WD112X0","SPI213","Review of Grammar","CCP EDUC I",0,1,0.0,0,1],
  [522,"WD122X0","SPI214","Intro. to Translation","CCP EDUC II",0,1,0.0,0,1],
  [523,"WD112X0","SPI243","Medical Interpreting I","CCP EDUC I",0,1,0.0,0,1],
  [524,"WD272X0","TRN110","Intro to Transport Tech","CCP SCTR I",0,1,0.0,0,1],
  [525,"WD272X2","TRN120","Basic Transp Electricity","CCP SCTR I (2 Credits)",0,2,0.0,0,1],
  [526,"WD092X0","WEB110","Web Development Fundamentals","CCP DTCS I",0,1,0.0,0,1],
  [527,"WD012X2","WLD115","SMAW (Stick) Plate","CCP ADMF I (2 Credits)",0,2,0.0,0,1]
];

const courses = rawData.map(r => ({
  id: r[0],
  state_code: r[1],
  course_code: r[2],
  course_name: r[3],
  master_label: r[4],
  caa: r[5],
  caa_label: r[5] === 1 ? "Eligible" : "Non-transfer",
  credit: r[6],
  added_value: r[7],
  course_weight: weights[r[8]],
  department: depts[r[9]]
}));

const pageSize = 25;
let page = 1;
let sortKey = "state_code";
let sortDirection = 1;

const searchEl = document.getElementById("search");
const departmentEl = document.getElementById("department");
const caaEl = document.getElementById("caa");
const weightEl = document.getElementById("weight");
const rowsEl = document.getElementById("rows");

function valueText(value) { return value === null || value === undefined ? "" : String(value); }
function uniqueValues(key) {
  return [...new Set(courses.map(row => valueText(row[key])).filter(Boolean))]
    .sort((a,b) => a.localeCompare(b, undefined, {numeric:true, sensitivity:"base"}));
}
function fillSelect(select, values) {
  values.forEach(value => {
    const option = document.createElement("option");
    option.value = value; option.textContent = value; select.appendChild(option);
  });
}
fillSelect(departmentEl, uniqueValues("department"));
fillSelect(caaEl, uniqueValues("caa_label"));
fillSelect(weightEl, uniqueValues("course_weight"));

function filteredCourses() {
  const query = searchEl.value.trim().toLowerCase();
  return courses.filter(row => {
    const matchesQuery = !query || Object.values(row).some(value => valueText(value).toLowerCase().includes(query));
    return matchesQuery &&
      (!departmentEl.value || valueText(row.department) === departmentEl.value) &&
      (!caaEl.value || valueText(row.caa_label) === caaEl.value) &&
      (!weightEl.value || valueText(row.course_weight) === weightEl.value);
  }).sort((a,b) => {
    const av = a[sortKey], bv = b[sortKey];
    const an = Number(av), bn = Number(bv);
    const bothNumeric = av !== "" && bv !== "" && Number.isFinite(an) && Number.isFinite(bn);
    const comparison = bothNumeric ? an - bn : valueText(av).localeCompare(valueText(bv), undefined, {numeric:true, sensitivity:"base"});
    return comparison * sortDirection;
  });
}

function render() {
  const filtered = filteredCourses();
  const pageCount = Math.max(1, Math.ceil(filtered.length / pageSize));
  page = Math.min(page, pageCount);
  const start = (page - 1) * pageSize;
  const visible = filtered.slice(start, start + pageSize);
  rowsEl.replaceChildren();

  visible.forEach(row => {
    const tr = document.createElement("tr");
    const cells = [
      ["state_code", "code"],
      ["course_code", "code"],
      ["course_name", ""],
      ["department", ""],
      ["caa_label", ""],
      ["credit", "code"],
      ["course_weight", ""],
      ["master_label", ""]
    ];
    cells.forEach(([key, className]) => {
      const td = document.createElement("td");
      const val = valueText(row[key]);
      
      if (key === "caa_label") {
        const span = document.createElement("span");
        span.className = "pill pill-caa";
        span.dataset.caa = val;
        span.textContent = val;
        td.appendChild(span);
      } else if (key === "department") {
        const span = document.createElement("span");
        span.className = "pill pill-dept";
        span.dataset.dept = val;
        span.textContent = val;
        td.appendChild(span);
      } else if (key === "course_weight") {
        const span = document.createElement("span");
        span.className = "pill pill-weight";
        span.dataset.weight = val;
        span.textContent = val;
        td.appendChild(span);
      } else if (className === "code") {
        const span = document.createElement("span");
        span.className = "code";
        span.textContent = val;
        td.appendChild(span);
      } else {
        td.textContent = val;
      }
      tr.appendChild(td);
    });
    rowsEl.appendChild(tr);
  });

  document.getElementById("empty").hidden = filtered.length !== 0;
  document.getElementById("count").textContent = `Showing ${filtered.length ? start + 1 : 0}–${Math.min(start + pageSize, filtered.length)} of ${filtered.length} matching courses · ${courses.length} total`;
  document.getElementById("page").textContent = `Page ${page} of ${pageCount}`;
  document.getElementById("previous").disabled = page <= 1;
  document.getElementById("next").disabled = page >= pageCount;
}

[searchEl, departmentEl, caaEl, weightEl].forEach(el => el.addEventListener("input", () => { page = 1; render(); }));
document.getElementById("reset").addEventListener("click", () => {
  searchEl.value = ""; departmentEl.value = ""; caaEl.value = ""; weightEl.value = ""; page = 1; render();
});
document.querySelectorAll("th button[data-sort]").forEach(button => button.addEventListener("click", () => {
  const key = button.dataset.sort;
  if (sortKey === key) sortDirection *= -1; else { sortKey = key; sortDirection = 1; }
  render();
}));
document.getElementById("previous").addEventListener("click", () => { page--; render(); });
document.getElementById("next").addEventListener("click", () => { page++; render(); });
render();
</script>
</body>
</html>
